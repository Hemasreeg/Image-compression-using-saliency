{% extends "base.html" %}

{% block title %}Login - AI Portrait Mode{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #1B211A 0%, #628141 50%, #8BAE66 100%);
        min-height: 100vh;
    }
    .auth-card {
        background: linear-gradient(135deg, rgba(27, 33, 26, 0.95) 0%, rgba(98, 129, 65, 0.9) 100%);
        border-radius: 25px;
        border: 2px solid rgba(235, 213, 171, 0.2);
    }
    .auth-card h2 {
        color: #8BAE66;
    }
    .auth-card p {
        color: #EBD5AB;
    }
    .form-label {
        color: #8BAE66 !important;
    }
    .form-control {
        background: rgba(235, 213, 171, 0.05);
        border: 1px solid rgba(235, 213, 171, 0.3);
        color: #EBD5AB;
    }
    .form-control:focus {
        background: rgba(235, 213, 171, 0.1);
        border-color: #8BAE66;
        color: #EBD5AB;
        box-shadow: 0 0 0 0.25rem rgba(235, 213, 171, 0.25);
    }
    .form-control::placeholder {
        color: rgba(176, 176, 118, 0.5);
    }
    .btn-primary {
        background: linear-gradient(135deg, #8BAE66 0%, #8BAE66 100%);
        border: none;
        color: #1B211A;
        font-weight: 700;
    }
    .btn-primary:hover {
        background: linear-gradient(135deg, #8BAE66 0%, #8BAE66 100%);
        color: #1B211A;
    }
    .btn-outline-secondary {
        border-color: rgba(235, 213, 171, 0.3);
        color: #8BAE66;
    }
    .btn-outline-secondary:hover {
        background: rgba(235, 213, 171, 0.1);
        border-color: #8BAE66;
        color: #8BAE66;
    }
    .invalid-feedback {
        color: #ff6b6b !important;
    }
    a {
        color: #8BAE66;
    }
    a:hover {
        color: #EBD5AB;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card p-5 shadow-lg">
                <div class="text-center mb-4">
                    <i class="fas fa-camera-retro fa-3x mb-3" style="color: #8BAE66;"></i>
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p>Login to your account</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-1"></i>Email Address
                        </label>
                        <input type="email" 
                               class="form-control form-control-lg" 
                               id="email" 
                               name="email" 
                               placeholder="your.email@example.com"
                               required 
                               autofocus>
                        <div class="invalid-feedback">
                            Please enter a valid email address.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-1"></i>Password
                        </label>
                        <div class="input-group">
                            <input type="password" 
                                   class="form-control form-control-lg" 
                                   id="password" 
                                   name="password" 
                                   placeholder="••••••••"
                                   required>
                            <button class="btn btn-outline-secondary" 
                                    type="button" 
                                    id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">
                            Password is required.
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-muted" for="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </div>

                    <div class="text-center">
                        <p class="text-muted mb-0">
                            Don't have an account? 
                            <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">
                                Register here
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });

    // Form validation
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        
        if (!email.value || !password.value) {
            e.preventDefault();
            this.classList.add('was-validated');
        }
    });
</script>
{% endblock %}
