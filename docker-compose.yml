# Docker Compose for AI Portrait Mode
version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./app/static/uploads:/app/app/static/uploads
      - ./app/static/results:/app/app/static/results
      - ./DUTS-TR:/app/DUTS-TR
      - ./DUTS-TE:/app/DUTS-TE
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
